    Security: external scripts are pinned with Subresource Integrity (SRI) hashes

  <title>Pod Recall Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;

    }

    header {
      width: 100%;
      background: #1a1a2e;

      text-align: center;

    }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.03em; }

    /* ── Camera ── */
    #camera-section { width: 100%; max-width: 600px; padding: 16px 16px 0; }

    #viewfinder-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #333;
    }
    #video { width: 100%; height: 100%; object-fit: cover; }

    /* Corner guides */
    #viewfinder-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(#fff 2px, transparent 2px) 20% 30% / 60px 2px no-repeat,
        linear-gradient(#fff 2px, transparent 2px) 20% 30% / 2px 60px no-repeat,
        linear-gradient(#fff 2px, transparent 2px) 80% 30% / -60px 2px no-repeat,
        linear-gradient(#fff 2px, transparent 2px) 80% 30% / 2px 60px no-repeat,
        linear-gradient(#fff 2px, transparent 2px) 20% 70% / 60px 2px no-repeat,
        linear-gradient(#fff 2px, transparent 2px) 20% 70% / 2px -60px no-repeat,
        linear-gradient(#fff 2px, transparent 2px) 80% 70% / -60px 2px no-repeat,
        linear-gradient(#fff 2px, transparent 2px) 80% 70% / 2px -60px no-repeat;
      pointer-events: none;
      opacity: 0.5;
    }

    #canvas { display: none; }
    #frozen-img {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 12px;
      padding: 16px;
      width: 100%;
      max-width: 600px;
    }
    button {
      flex: 1;
      border: none;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 18px 10px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active  { transform: scale(0.96); }
    button:disabled { opacity: 0.35; cursor: default; }

    #btn-scan   { background: #4a90d9; color: #fff; font-size: 1.4rem; }
    #btn-retake { background: #444; color: #fff; display: none; }

    /* ── Result card ── */
    #status-area { width: 100%; max-width: 600px; padding: 0 16px 16px; }

    #spinner {
      display: none;
      text-align: center;
      padding: 24px 16px;
      color: #aac4e0;
    }
    #spinner-msg { font-size: 1.1rem; margin-bottom: 14px; min-height: 1.5em; }
    #progress-bar-wrap {
      width: 100%;
      background: #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      height: 10px;
    }
    #progress-bar {
      height: 10px;
      width: 0%;
      background: #4a90d9;
      border-radius: 8px;
      transition: width 0.3s ease;
    }
    #progress-bar-wrap.indeterminate #progress-bar {
      width: 40% !important;
      transition: none;
      animation: indeterminate-slide 1.4s ease-in-out infinite;
    }
    @keyframes indeterminate-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }

    #result-card {
      display: none;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      margin-top: 4px;
    }
    #result-card.safe    { background: #0a3d1e; border: 4px solid #22c55e; }
    #result-card.recall  { background: #3d0a0a; border: 4px solid #ef4444; }
    #result-card.unknown { background: #2a2a2a; border: 4px solid #888; }

    #result-icon  { font-size: 4rem; line-height: 1; }
    #result-title {
      font-size: 2.4rem; font-weight: 900;
      margin: 8px 0 6px; letter-spacing: 0.05em;
    }
    #result-card.safe    #result-title { color: #22c55e; }
    #result-card.recall  #result-title { color: #ef4444; }
    #result-card.unknown #result-title { color: #aaa; }

    #result-lot {
      font-size: 1.3rem;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      color: #fff;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 6px 12px;
      display: inline-block;
      margin: 4px 0 10px;
    }
    #result-detail { font-size: 1rem; color: #ccc; line-height: 1.5; white-space: pre-line; }

    /* ── Manual entry ── */
    #manual-section { width: 100%; max-width: 600px; padding: 0 16px 24px; }
    #manual-section details {
      background: #1e1e1e;
      border-radius: 14px;
      border: 1px solid #333;
      overflow: hidden;
    }
    #manual-section summary {
      padding: 16px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; color: #aac4e0;
      list-style: none;
    }
    #manual-section summary::-webkit-details-marker { display: none; }
    #manual-section summary::before { content: '⌨️  '; }
    .manual-inner { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; }

    #lot-input {
      background: #111;
      border: 2px solid #444;
      border-radius: 10px;
      color: #fff;
      font-size: 1.3rem;
      font-family: 'Courier New', monospace;
      padding: 14px;
      width: 100%;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    #lot-input:focus { outline: none; border-color: #4a90d9; }

    #btn-manual-check { background: #4a6d9d; color: #fff; font-size: 1.1rem; }

    /* Partial match list */
    #partial-results { display: none; margin-top: 12px; }
    #partial-results h3 { font-size: 1rem; color: #aac4e0; margin-bottom: 8px; }

    .partial-match {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .partial-match:active { background: #252525; }
    .partial-match .pm-lot {
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      color: #fff;
    }
    .partial-match .pm-lot em {
      font-style: normal;
      color: #f59e0b;
      font-weight: 700;
    }
    .partial-match .pm-badge {
      font-size: 0.85rem; font-weight: 700;
      padding: 4px 10px; border-radius: 6px; white-space: nowrap;
    }
    .partial-match .pm-badge.bad { background: #3d0a0a; color: #ef4444; border: 1px solid #ef4444; }
    #partial-too-many { display: none; color: #888; font-size: 0.95rem; padding: 8px 0; text-align: center; }

    /* ── Raw OCR (collapsed debug view) ── */
    #ocr-section { display: none; width: 100%; max-width: 600px; padding: 0 16px 24px; }
    #ocr-section details { background: #1a1a1a; border-radius: 10px; border: 1px solid #2a2a2a; }
    #ocr-section summary { padding: 10px 14px; font-size: 0.85rem; color: #666; cursor: pointer; list-style: none; }
    #ocr-section summary::-webkit-details-marker { display: none; }
    #ocr-raw {
      padding: 10px 14px; font-size: 0.75rem; color: #555;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap; word-break: break-all;
      max-height: 150px; overflow-y: auto;
    }

    /* ── OCR candidates ── */
    #candidates-list { display: none; width: 100%; max-width: 600px; padding: 0 16px 16px; }
    #candidates-list h3 { font-size: 0.9rem; color: #888; margin-bottom: 8px; }
    .cand-btn {
      display: inline-block;
      background: #2a2a2a; border: 1px solid #444; border-radius: 8px;
      padding: 8px 14px; margin: 4px;
      font-size: 1rem; font-family: 'Courier New', monospace; color: #ddd;
      cursor: pointer; flex: none;
    }
    .cand-btn:active { background: #3a3a3a; }

    footer {
      margin-top: auto;
      padding: 12px 16px;
      font-size: 0.75rem; color: #444; text-align: center;
    }
  </style>
</head>

<script src="lots.js" integrity="sha384-OVZaEI1xaHZ5+vZEobZxKNyGtAkY8W81AsUSS07teu8PlIdydLVaNwNm1XQs/zzr" crossorigin="anonymous"></script>

  Pinned to tesseract.js v5.1.1. SRI hash ensures this exact file is served.

<script
  src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"
  integrity="sha384-GJqSu7vueQ9qN0E9yLPb3Wtpd7OrgK8KmYzC8T1IysG1bcvxvIO4qtYR/D3A991F"
  crossorigin="anonymous"></script>

<script>
'use strict';

// ─────────────────────────────────────────────
//  AFFECTED LOT DATABASE  (Global, all regions)
//  Source: omnipod.com/mdc/check-pod-lot?c=CC-5464839, May 2026
// ─────────────────────────────────────────────
// Lot database loaded from lots.js (see <script src> tag in <head>)

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────

function productName(lot) {
  if (lot.startsWith('L'))    return 'Omnipod Eros';
  if (lot.startsWith('PD1U')) return 'Omnipod DASH';
  if (lot.startsWith('PH1U')) return 'Omnipod 5';
  if (lot.startsWith('PR1U')) return 'Omnipod 5 (Refill)';
  return 'Omnipod Pod';
}

/** Strip to alphanumeric + spaces before passing to Web Speech API */
function sanitizeForSpeech(str) {
  return str.replace(/[^A-Z0-9 ]/gi, '');
}

// ─────────────────────────────────────────────
//  LOT EXTRACTION from OCR text
// ─────────────────────────────────────────────
function extractLotCandidates(text) {
  if (!text) return [];

  // Normalise common OCR confusions in alphanumeric lot codes
  const normalised = text.toUpperCase()
    .replace(/O(?=\d)/g,       '0')  // O→0 before digit
    .replace(/(?<=\d)O/g,      '0')  // O→0 after digit
    .replace(/\bI(?=\d)/g,     '1'); // I→1 at word boundary before digit

  const candidates = new Set();

  // Full DASH / Omnipod 5 lot format: prefix + 8 alphanumeric chars
  const reFull = /(?:P[DH]1U|PR1U)[0-9A-Z]{8}/g;
  let m;
  while ((m = reFull.exec(normalised)) !== null) candidates.add(m[0]);

  // Eros short format: L + 5 digits
  const reEros = /L\d{5}/g;
  while ((m = reEros.exec(normalised)) !== null) candidates.add(m[0]);

  return [...candidates];
}

// ─────────────────────────────────────────────
//  CAMERA
// ─────────────────────────────────────────────
const video     = document.getElementById('video');
const canvas    = document.getElementById('canvas');
const frozenImg = document.getElementById('frozen-img');
const btnScan   = document.getElementById('btn-scan');
const btnRetake = document.getElementById('btn-retake');
let stream   = null;
let scanning = false;
let currentBlobUrl = null;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false,
    });
    video.srcObject = stream;
    video.style.display = 'block';
    frozenImg.style.display = 'none';
    btnScan.style.display = '';
    btnRetake.style.display = 'none';
  } catch (_err) {
    // Camera unavailable — fall back to file picker
    btnScan.textContent = '📂 Choose Photo';
    btnScan.onclick = pickFile;
  }
}

function captureFrame() {
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  frozenImg.src = dataUrl;
  frozenImg.style.display = 'block';
  video.style.display = 'none';
  stream && stream.getTracks().forEach(t => { t.enabled = false; });
  return dataUrl;
}

function retake() {
  stream && stream.getTracks().forEach(t => { t.enabled = true; });
  video.style.display = 'block';
  frozenImg.style.display = 'none';
  frozenImg.src = '';
  btnScan.style.display = '';
  btnRetake.style.display = 'none';
  hideResult();
  revokeBlobUrl();
}

function revokeBlobUrl() {
  if (currentBlobUrl) {
    URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = null;
  }
}

function pickFile() {
  const inp = document.createElement('input');
  inp.type    = 'file';
  inp.accept  = 'image/*';
  inp.capture = 'environment';
  inp.onchange = async () => {
    if (!inp.files.length) return;
    revokeBlobUrl();
    currentBlobUrl = URL.createObjectURL(inp.files[0]);
    frozenImg.src = currentBlobUrl;
    frozenImg.style.display = 'block';
    video.style.display = 'none';
    btnScan.style.display = 'none';
    btnRetake.style.display = '';
    await runOCR(currentBlobUrl);
  };
  inp.click();
}

// ─────────────────────────────────────────────
//  OCR
// ─────────────────────────────────────────────
async function runOCR(imageSource) {
  setSpinner('Starting up…', 0);
  document.getElementById('spinner').style.display = 'block';
  hideResult();
  hideCandidates();

  let timedOut = false;
  const initTimeout = setTimeout(() => {
    timedOut = true;
    showSpinner(false);
    showResult('unknown', '', 'Download timed out',
      'OCR engine did not load. Check your connection and try again,\nor type the lot number manually below.');
  }, 90000);

  try {
    const statusLabels = {
      'loading tesseract core':       'Loading OCR engine…',
      'initializing tesseract':       'Initializing OCR…',
      'loading language traineddata': 'Downloading language data\n(first scan only, ~10 MB)…',
      'initialized tesseract':        'OCR ready…',
      'recognizing text':             'Reading lot number…',
    };
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: ({ status, progress }) => {
        const msg = statusLabels[status] || status;
        const isDownload = status === 'loading language traineddata';
        document.getElementById('progress-bar-wrap').classList.toggle('indeterminate', isDownload);
        setSpinner(msg, isDownload ? 0 : Math.round((progress || 0) * 100));
      },
      langPath: 'https://tessdata.projectnaptha.com/4.0.0',
    });
    clearTimeout(initTimeout);
    if (timedOut) { await worker.terminate(); return; }
    await worker.setParameters({
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ',
      tessedit_pageseg_mode: '6', // uniform block of text
    });
    const { data } = await worker.recognize(imageSource);
    await worker.terminate();

    const rawText = data.text || '';
    document.getElementById('ocr-raw').textContent = rawText;
    document.getElementById('ocr-section').style.display = 'block';

    showSpinner(false);
    const candidates = extractLotCandidates(rawText);

    if (candidates.length === 0) {
      showResult('unknown', '', 'No lot number found',
        'Try holding the phone closer and steadier,\nor type the lot number manually below.');
      return;
    }
    if (candidates.length === 1) {
      const lot = candidates[0];
      showResultForLot(lot, AFFECTED_LOTS.has(lot));
    } else {
      // Surface any recalled lot immediately; also show all candidates for review
      const recalled = candidates.filter(c => AFFECTED_LOTS.has(c));
      const primary  = recalled.length > 0 ? recalled[0] : candidates[0];
      showResultForLot(primary, AFFECTED_LOTS.has(primary));
      showCandidates(candidates);
    }
  } catch (err) {
    clearTimeout(initTimeout);
    showSpinner(false);
    showResult('unknown', '', 'OCR Error',
      'Could not process image.\nPlease type the lot number manually below.');
    console.error('Tesseract error:', err);
  }
}

// ─────────────────────────────────────────────
//  UI HELPERS
// ─────────────────────────────────────────────
function showSpinner(on) {
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  if (!on) {
    setSpinner('', 0);
    document.getElementById('progress-bar-wrap').classList.remove('indeterminate');
  }
}

function setSpinner(msg, pct) {
  document.getElementById('spinner-msg').textContent = msg;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function hideResult() {
  const card = document.getElementById('result-card');
  card.style.display = 'none';
  card.className = '';
}

function hideCandidates() {
  document.getElementById('candidates-list').style.display = 'none';
}

function showResultForLot(lot, affected) {
  if (affected) {
    showResult('recall', lot, '⚠ RECALL',
      `This lot is affected by recall CC-5464839.\nProduct: ${productName(lot)}\n\nDo NOT use. Contact Insulet: 1-800-641-2049`);
    speak(`Warning. Recall alert. Lot number ${sanitizeForSpeech(lot)} is recalled. Do not use this pod.`);
  } else {
    showResult('safe', lot, '✓ NOT RECALLED',
      `Lot ${lot} is not on the recall list.\nProduct: ${productName(lot)}`);
    speak(`Good. Lot number ${sanitizeForSpeech(lot)} is not recalled.`);
  }
}

function showResult(type, lot, title, detail) {
  const card = document.getElementById('result-card');
  card.className = type;
  document.getElementById('result-icon').textContent =
    type === 'safe' ? '✅' : type === 'recall' ? '🚨' : '❓';
  document.getElementById('result-title').textContent  = title;
  document.getElementById('result-lot').textContent    = lot;
  document.getElementById('result-lot').style.display  = lot ? 'inline-block' : 'none';
  document.getElementById('result-detail').textContent = detail;
  card.style.display = 'block';
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/** Build the OCR candidate buttons using DOM methods (no innerHTML with dynamic content) */
function showCandidates(lots) {
  const wrap  = document.getElementById('candidates-list');
  const inner = document.getElementById('candidates-inner');
  inner.textContent = ''; // safe clear
  lots.forEach(lot => {
    const btn = document.createElement('button');
    btn.type      = 'button';
    btn.className = 'cand-btn';
    btn.textContent = lot; // textContent — never innerHTML
    btn.addEventListener('click', () => {
      showResultForLot(lot, AFFECTED_LOTS.has(lot));
      hideCandidates();
    });
    inner.appendChild(btn);
  });
  wrap.style.display = 'block';
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate   = 0.9;
  utt.volume = 1;
  window.speechSynthesis.speak(utt);
}

// ─────────────────────────────────────────────
//  MANUAL / PARTIAL LOOKUP
// ─────────────────────────────────────────────

/**
 * Build the highlighted lot display using DOM nodes.
 * `lot` and `query` both come from controlled sources (hardcoded Set / uppercase
 * alphanumeric user input), but we use DOM methods rather than innerHTML regardless.
 */
function buildHighlightedLot(lot, query) {
  const span = document.createElement('span');
  span.className = 'pm-lot';
  const idx = lot.indexOf(query);
  if (idx === -1) {
    span.textContent = lot;
    return span;
  }
  span.appendChild(document.createTextNode(lot.slice(0, idx)));
  const em = document.createElement('em');
  em.textContent = lot.slice(idx, idx + query.length);
  span.appendChild(em);
  span.appendChild(document.createTextNode(lot.slice(idx + query.length)));
  return span;
}

function doManualCheck() {
  // Accept only uppercase alphanumeric — discard anything else
  const raw = document.getElementById('lot-input').value.trim().toUpperCase();
  const val = raw.replace(/[^A-Z0-9]/g, '');
  if (!val) return;

  const partialDiv   = document.getElementById('partial-results');
  const partialHead  = document.getElementById('partial-heading');
  const partialInner = document.getElementById('partial-inner');
  const tooMany      = document.getElementById('partial-too-many');
  partialInner.textContent = ''; // safe clear
  tooMany.style.display    = 'none';

  // Exact hit in the affected set
  if (AFFECTED_LOTS.has(val)) {
    partialDiv.style.display = 'none';
    showResultForLot(val, true);
    return;
  }

  // Partial search across all affected lots
  const allLots = [...AFFECTED_LOTS];
  const matches = allLots.filter(l => l.includes(val));

  if (matches.length === 0) {
    partialDiv.style.display = 'none';
    showResult('safe', val, 'NOT IN RECALL LIST',
      `"${val}" does not match any affected lot.\nIf you entered a partial number, it may simply not appear in recalled lots.\nFor certainty, enter the full lot number.`);
    speak(`${sanitizeForSpeech(val)} was not found in the recall list.`);
    return;
  }

  if (matches.length === 1) {
    partialDiv.style.display = 'none';
    showResultForLot(matches[0], true);
    return;
  }

  // Multiple matches — show list
  hideResult();
  partialHead.textContent = `${matches.length} recalled lot${matches.length !== 1 ? 's' : ''} match "${val}" — tap to confirm:`;
  partialDiv.style.display = 'block';

  const MAX_SHOW = 20;
  matches.slice(0, MAX_SHOW).forEach(lot => {
    const row = document.createElement('div');
    row.className = 'partial-match';
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');

    row.appendChild(buildHighlightedLot(lot, val));

    const badge = document.createElement('span');
    badge.className = 'pm-badge bad';
    badge.textContent = 'RECALL';
    row.appendChild(badge);

    const onSelect = () => {
      partialDiv.style.display = 'none';
      showResultForLot(lot, true);
    };
    row.addEventListener('click', onSelect);
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') onSelect(); });

    partialInner.appendChild(row);
  });

  if (matches.length > MAX_SHOW) {
    tooMany.textContent = `…and ${matches.length - MAX_SHOW} more. Type more characters to narrow down.`;
    tooMany.style.display = 'block';
  }
}

// ─────────────────────────────────────────────
//  EVENT WIRING
// ─────────────────────────────────────────────
btnScan.addEventListener('click', async () => {
  if (scanning) return;
  scanning = true;
  btnScan.style.display   = 'none';
  btnRetake.style.display = '';
  const dataUrl = captureFrame();
  await runOCR(dataUrl);
  scanning = false;
});

btnRetake.addEventListener('click', () => {
  retake();
  document.getElementById('ocr-section').style.display = 'none';
  hideCandidates();
});

document.getElementById('btn-manual-check').addEventListener('click', doManualCheck);

document.getElementById('lot-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doManualCheck();
});

// Debounced live search (fires after user pauses typing)
let debounceTimer;
document.getElementById('lot-input').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const val = document.getElementById('lot-input').value.trim().replace(/[^A-Z0-9]/gi, '');
  if (val.length >= 4) {
    debounceTimer = setTimeout(doManualCheck, 350);
  } else {
    document.getElementById('partial-results').style.display = 'none';
    hideResult();
  }
});

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
startCamera();
</script>
